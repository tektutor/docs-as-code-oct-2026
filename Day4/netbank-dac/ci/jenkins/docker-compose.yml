# Start Jenkins for the NetBank labs:   docker compose up -d --build
# Then open http://localhost:8080
services:
  jenkins:
    build: .
    environment:
      - JAVA_OPTS=-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ../..:/workspace/netbank-dac:ro
volumes:
  jenkins_home:
